name: investflow-e2e

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: investflow
      POSTGRES_USER: investflow
      POSTGRES_PASSWORD: investflow
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investflow -d investflow"]
      interval: 2s
      timeout: 5s
      retries: 15

  backend:
    build:
      context: ./investflow-back
    ports:
      - "18080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/investflow
      SPRING_DATASOURCE_USERNAME: investflow
      SPRING_DATASOURCE_PASSWORD: investflow
      SERVER_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
