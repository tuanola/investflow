spring:
  application:
    name: investflow

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/investflow}
    username: ${SPRING_DATASOURCE_USERNAME:investflow}
    password: ${SPRING_DATASOURCE_PASSWORD:investflow}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info